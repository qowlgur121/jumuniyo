server:
  port: 8081

spring:
  # --- 데이터베이스 설정 (MySQL) ---
  datasource:
    url: jdbc:mysql://localhost:3306/jumuniyo_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root # 로컬 MySQL 사용자명 (실제 사용하는 계정으로 변경)
    password: 1234 # 로컬 MySQL 비밀번호 (실제 사용하는 비밀번호로 변경해야 함)
    driver-class-name: com.mysql.cj.jdbc.Driver

  # --- JPA/Hibernate 설정 ---
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        # dialect: org.hibernate.dialect.MySQLDialect # MySQL 사용 시 보통 자동 감지

  # --- 파일 업로드 설정 ---
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
      enabled: true

  # --- OAuth2 소셜 로그인 설정 ---
  security:
    oauth2:
      client:
        registration:
          # Google OAuth2 설정
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id-for-development}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            redirect-uri: "http://localhost:8081/oauth2/callback/{registrationId}"
            scope:
              - email
              - profile
          
          # Naver OAuth2 설정
          naver:
            client-id: ${NAVER_CLIENT_ID:dummy-naver-client-id-for-development}
            client-secret: ${NAVER_CLIENT_SECRET:dummy-naver-client-secret}
            redirect-uri: "http://localhost:8081/oauth2/callback/{registrationId}"
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
              - profile_image
            client-name: Naver
          
          # Kakao OAuth2 설정
          kakao:
            client-id: ${KAKAO_CLIENT_ID:dummy-kakao-client-id-for-development}
            client-secret: ${KAKAO_CLIENT_SECRET:dummy-kakao-client-secret}
            redirect-uri: "http://localhost:8081/oauth2/callback/{registrationId}"
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - account_email
              - profile_image
            client-name: Kakao
            client-authentication-method: POST
        
        provider:
          # Naver Provider 설정
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          
          # Kakao Provider 설정
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# --- JWT 설정 ---
jwt:
  secret-key: jumuniyoSecretKeyForJWTTokenGenerationThatMustBeLongEnoughForHS256AlgorithmSecurity
  token-validity-in-seconds: 86400 # 24시간 (24 * 60 * 60)

# --- 파일 업로드 설정 ---
file:
  upload:
    path: ${user.home}/jumuniyo/uploads
    base-url: http://localhost:8081

# --- 로깅 설정 ---
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace
    com.jumuniyo: debug
    org.springframework.security: debug
    org.springframework.web: debug
    # org.springframework.web: debug
    # org.springframework.security: debug

