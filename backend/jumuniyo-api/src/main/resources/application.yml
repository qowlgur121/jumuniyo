server:
  port: 8081

spring:
  # --- 데이터베이스 설정 (MySQL) ---
  datasource:
    url: jdbc:mysql://localhost:3306/jumuniyo_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root # 로컬 MySQL 사용자명 (실제 사용하는 계정으로 변경)
    password: 1234 # 로컬 MySQL 비밀번호 (실제 사용하는 비밀번호로 변경해야 함)
    driver-class-name: com.mysql.cj.jdbc.Driver

  # --- JPA/Hibernate 설정 ---
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        # dialect: org.hibernate.dialect.MySQLDialect # MySQL 사용 시 보통 자동 감지

# --- 로깅 설정 ---
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace
    com.jumuniyo: debug
    # org.springframework.web: debug
    # org.springframework.security: debug

